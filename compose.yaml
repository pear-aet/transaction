services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      CQ_API_TOKEN: ${CQ_API_TOKEN:?set-a-32-character-token}
      CQ_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
