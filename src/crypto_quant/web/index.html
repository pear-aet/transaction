<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Crypto Quant</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">RESEARCH / PAPER / SHADOW</p><h1>币安合约量化控制台</h1><p>统一账户风控、逐币样本外验证与模拟盘监控。没有实盘下单能力。</p></header>
    <section class="card controls">
      <label>API Token<input id="token" type="password" autocomplete="off" placeholder="本地未设置可留空"></label>
      <label>币种<select id="symbol"><option>BTC/USDT:USDT</option><option>ETH/USDT:USDT</option></select></label>
      <label>历史天数<input id="days" type="number" min="30" max="1460" value="180"></label>
      <label>单笔风险<input id="risk" type="number" min="0.1" max="5" step="0.1" value="1"><span>%</span></label>
      <label>杠杆上限<input id="leverage" type="number" min="1" max="100" value="100"></label>
      <label>入口模型<select id="model"><option value="chan_fractal">缠论确认分型</option><option value="chan_third_point">缠论三类买卖点</option><option value="donchian">唐奇安突破</option><option value="ema_pullback">EMA 回踩</option></select></label>
      <div class="actions"><button id="run">提交回测任务</button><button id="select" class="secondary">严格逐币选优</button><button id="portfolio" class="secondary">刷新账户</button><button id="stop" class="danger">全局停止</button></div>
    </section>
    <p id="status" role="status"></p>
    <section id="metrics" class="metrics" hidden></section>
    <section class="card"><canvas id="chart" height="220"></canvas><pre id="output">等待运行。</pre></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
