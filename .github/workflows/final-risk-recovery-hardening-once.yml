name: Final Risk Recovery Hardening Once

on:
  push:
    branches:
      - risk-engine-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out risk branch
        uses: actions/checkout@v4
        with:
          ref: risk-engine-v1
          fetch-depth: 0

      - name: Harden replay, provenance and decision invariants
        run: python scripts/final_risk_recovery_hardening.py

      - name: Format and lint
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff format src tests
          ruff check src tests

      - name: Remove one-shot hardening files and commit
        run: |
          git rm .github/workflows/final-risk-recovery-hardening-once.yml
          git rm scripts/final_risk_recovery_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Harden Risk Engine recovery and decision provenance"
          git push origin HEAD:risk-engine-v1
