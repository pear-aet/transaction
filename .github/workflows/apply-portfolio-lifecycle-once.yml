name: Apply Portfolio Lifecycle Once

on:
  push:
    branches:
      - portfolio-account-engine-v1
    paths:
      - .github/workflows/apply-portfolio-lifecycle-once.yml
      - scripts/patch_portfolio_lifecycle.py
      - scripts/fix_portfolio_lifecycle_patch_indentation.py
      - scripts/patch_portfolio_lifecycle_failures.py
      - scripts/patch_portfolio_lifecycle_round3.py
      - scripts/patch_portfolio_lifecycle_round4.py
      - src/crypto_quant/portfolio_facts.py
      - tests/test_portfolio_lifecycle.py
      - tests/test_portfolio_lifecycle_store.py
      - tests/test_execution_store_scans.py

permissions:
  contents: write

concurrency:
  group: portfolio-lifecycle-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-account-engine-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --quiet --upgrade pip "setuptools>=83"
          pip install --quiet -e ".[dev]"
          pip install --quiet pip-audit bandit

      - name: Apply lifecycle patches
        run: |
          python scripts/fix_portfolio_lifecycle_patch_indentation.py
          python scripts/patch_portfolio_lifecycle.py
          python scripts/patch_portfolio_lifecycle_failures.py
          python scripts/patch_portfolio_lifecycle_round4.py

      - name: Format and lint
        run: |
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests

      - name: Run focused lifecycle diagnostics
        run: |
          pytest -vv --tb=short \
            tests/test_portfolio_lifecycle.py::test_partial_close_funding_and_full_close_produce_one_complete_trade_fact \
            tests/test_portfolio_lifecycle_store.py::test_full_close_and_closed_position_commit_in_one_transaction \
            tests/test_portfolio_lifecycle_store.py::test_critical_reconciliation_finding_halts_account_without_mutating_history

      - name: Run all Portfolio lifecycle and project tests
        run: |
          pytest -q tests/test_portfolio_lifecycle.py tests/test_portfolio_lifecycle_store.py tests/test_execution_store_scans.py
          pytest -q
          pip-audit
          bandit -r src -x tests -ll

      - name: Remove one-shot files and commit
        run: |
          git rm .github/workflows/apply-portfolio-lifecycle-once.yml
          git rm scripts/patch_portfolio_lifecycle.py
          git rm scripts/fix_portfolio_lifecycle_patch_indentation.py
          git rm scripts/patch_portfolio_lifecycle_failures.py
          git rm scripts/patch_portfolio_lifecycle_round3.py
          git rm scripts/patch_portfolio_lifecycle_round4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Add durable Portfolio lifecycle and reconciliation facts"
          git push origin HEAD:portfolio-account-engine-v1
