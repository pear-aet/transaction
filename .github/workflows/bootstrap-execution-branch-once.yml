name: Bootstrap Execution Engine Branch Once

on:
  push:
    branches:
      - risk-engine-v1

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out final Risk Engine branch
        uses: actions/checkout@v4
        with:
          ref: risk-engine-v1
          fetch-depth: 0

      - name: Create Execution Engine branch from validated parent tree
        run: |
          if git ls-remote --exit-code --heads origin refs/heads/execution-engine-v1; then
            echo "execution-engine-v1 already exists"
          else
            git push origin HEAD^:refs/heads/execution-engine-v1
          fi

      - name: Remove one-shot bootstrap from Risk Engine branch
        run: |
          git rm .github/workflows/bootstrap-execution-branch-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Execution Engine branch bootstrap"
          git push origin HEAD:risk-engine-v1
