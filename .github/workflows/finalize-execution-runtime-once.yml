name: Finalize Execution Runtime Once

on:
  push:
    branches:
      - execution-engine-v1

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: execution-engine-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply runtime and outbox hardening
        run: python scripts/finalize_execution_runtime.py

      - name: Install project
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"

      - name: Format and lint
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests

      - name: Run Execution tests
        run: |
          pytest -q \
            tests/test_execution.py \
            tests/test_execution_store.py \
            tests/test_execution_engine_outbox.py \
            tests/test_execution_runtime.py

      - name: Run complete test suite
        run: pytest -q

      - name: Remove one-shot files and commit
        run: |
          git rm .github/workflows/finalize-execution-runtime-once.yml
          git rm scripts/finalize_execution_runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Finalize Execution runtime and serialized outbox"
          git push origin HEAD:execution-engine-v1
