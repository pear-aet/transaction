name: Definitive Risk Engine Validation Once

on:
  push:
    branches:
      - risk-engine-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out risk branch
        uses: actions/checkout@v4
        with:
          ref: risk-engine-v1
          fetch-depth: 0

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"
          pip install pip-audit bandit

      - name: Apply canonical formatting
        run: ruff format src tests

      - name: Run Ruff checks
        run: ruff check src tests

      - name: Run complete test suite
        run: |
          set -o pipefail
          pytest -q | tee /tmp/risk-pytest.txt

      - name: Run dependency audit
        run: pip-audit

      - name: Run Bandit medium and high severity scan
        run: bandit -r src -x tests -ll

      - name: Build Docker image
        run: docker build -t crypto-quant:risk-engine-definitive .

      - name: Record validation and remove one-shot workflow
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          summary = Path("/tmp/risk-pytest.txt").read_text(encoding="utf-8").splitlines()[-1]
          source = os.environ["GITHUB_SHA"]
          Path("docs/RISK_ENGINE_FINAL_VALIDATION.md").write_text(
              "# Risk Engine Final Validation\n\n"
              f"Validated source commit: `{source}`\n\n"
              "All gates below ran successfully on the same checkout after canonical formatting:\n\n"
              "- Ruff formatting applied to `src` and `tests`;\n"
              "- Ruff lint passed;\n"
              f"- complete Pytest suite passed: `{summary}`;\n"
              "- `pip-audit` reported no known dependency vulnerabilities;\n"
              "- Bandit medium/high severity scan passed;\n"
              "- Docker image build passed.\n\n"
              "This validation does not authorize live trading. Execution Engine and exchange-order submission remain outside scope.\n",
              encoding="utf-8",
          )
          PY
          git rm .github/workflows/final-risk-validation-v2-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git commit -m "Record definitive Risk Engine validation"
          git push origin HEAD:risk-engine-v1
