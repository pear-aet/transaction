name: Apply Execution Hardening Once

on:
  push:
    branches:
      - execution-engine-v1
    paths:
      - .github/workflows/apply-execution-hardening-once.yml
      - scripts/apply_execution_hardening.py
      - scripts/patch_execution_recovery_setup.py

permissions:
  contents: write

concurrency:
  group: execution-hardening-once
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: execution-engine-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"
          pip install pip-audit bandit

      - name: Apply hardening patch
        run: |
          python scripts/apply_execution_hardening.py
          python scripts/patch_execution_recovery_setup.py

      - name: Format, lint and test
        run: |
          ruff format src tests
          ruff check src tests
          pytest -q
          pip-audit
          bandit -r src -x tests -ll

      - name: Remove one-shot files and commit
        run: |
          git rm .github/workflows/apply-execution-hardening-once.yml
          git rm scripts/apply_execution_hardening.py
          git rm scripts/patch_execution_recovery_setup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Harden Execution Engine recovery and protection invariants"
          git push origin HEAD:execution-engine-v1
