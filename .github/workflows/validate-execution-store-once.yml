name: Validate Execution Store Once

on:
  push:
    branches:
      - execution-engine-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: execution-engine-v1
          fetch-depth: 0

      - name: Install project
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"

      - name: Format, lint and test store
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests
          pytest -q tests/test_execution.py tests/test_execution_store.py

      - name: Remove workflow and commit canonical files
        run: |
          git rm .github/workflows/validate-execution-store-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Validate atomic Execution store"
          git push origin HEAD:execution-engine-v1
