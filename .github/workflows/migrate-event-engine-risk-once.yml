name: Migrate EventEngine Risk Once

on:
  push:
    branches:
      - risk-engine-v1

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out risk branch
        uses: actions/checkout@v4
        with:
          ref: risk-engine-v1
          fetch-depth: 0

      - name: Route EventEngine through Risk Engine
        run: python scripts/migrate_event_engine_risk.py

      - name: Format and lint
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff format src tests
          ruff check src tests

      - name: Remove one-shot migration files and commit
        run: |
          git rm .github/workflows/migrate-event-engine-risk-once.yml
          git rm scripts/migrate_event_engine_risk.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Route EventEngine entries through Risk Engine"
          git push origin HEAD:risk-engine-v1
