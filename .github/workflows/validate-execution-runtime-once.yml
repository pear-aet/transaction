name: Validate Execution Engine Runtime Once

on:
  push:
    branches:
      - execution-engine-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: execution-engine-v1
          fetch-depth: 0

      - name: Apply execution hardening patches
        run: |
          python scripts/harden_execution_engine.py
          python scripts/harden_execution_runtime.py

      - name: Install project
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"

      - name: Format, lint and test execution stack
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests
          pytest -q \
            tests/test_execution.py \
            tests/test_execution_store.py \
            tests/test_execution_broker.py \
            tests/test_execution_engine.py \
            tests/test_execution_runtime.py

      - name: Remove one-shot files and commit canonical implementation
        run: |
          git rm .github/workflows/validate-execution-runtime-once.yml
          git rm scripts/harden_execution_engine.py
          git rm scripts/harden_execution_runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Complete durable Execution Engine runtime"
          git push origin HEAD:execution-engine-v1
