name: Stabilize Execution Runtime Once

on:
  push:
    branches:
      - execution-engine-v1

permissions:
  contents: write

concurrency:
  group: stabilize-execution-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: execution-engine-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply or verify runtime patch
        run: |
          if [ -f scripts/finalize_execution_runtime.py ]; then
            python scripts/finalize_execution_runtime.py
          fi
          python - <<'PY'
          from pathlib import Path
          import re

          engine_path = Path("src/crypto_quant/execution_engine.py")
          engine = engine_path.read_text(encoding="utf-8")
          if "self._outbox_lock = asyncio.Lock()" not in engine:
              marker = "        self._processing_lock = asyncio.Lock()\n"
              if engine.count(marker) != 1:
                  raise SystemExit("cannot locate ExecutionEngine processing lock")
              engine = engine.replace(
                  marker,
                  marker + "        self._outbox_lock = asyncio.Lock()\n",
                  1,
              )
          if "async def _flush_outbox_unlocked(" not in engine:
              start = engine.index("    async def flush_outbox(")
              end = engine.index("    async def bootstrap(", start)
              block = engine[start:end].replace(
                  "    async def flush_outbox(",
                  "    async def _flush_outbox_unlocked(",
                  1,
              )
              wrapper = '''    async def flush_outbox(
                  self,
                  *,
                  now_ms: int | None = None,
              ) -> ExecutionBootstrapResult:
                  async with self._outbox_lock:
                      return await self._flush_outbox_unlocked(now_ms=now_ms)

          '''
              engine = engine[:start] + block + wrapper + engine[end:]
          engine_path.write_text(engine, encoding="utf-8")

          for filename in (
              "tests/test_execution_engine_outbox.py",
              "tests/test_execution_runtime.py",
          ):
              path = Path(filename)
              if not path.exists():
                  raise SystemExit(f"missing generated test file: {filename}")
              text = path.read_text(encoding="utf-8")
              text = text.replace(
                  "from crypto_quant.execution_broker import ExecutionBroker\n",
                  "",
              )
              text = text.replace("    OrderState,\n", "")
              text = text.replace("    OrderUpdate,\n", "")
              text = text.replace(
                  "class CountingBroker(ExecutionBroker):",
                  "class CountingBroker:",
              )
              text = re.sub(
                  r"    def dispatch\(self, command, orders, now_ms\):\n"
                  r"        self\.calls \+= 1\n"
                  r"        return tuple\(.*?\n            for order in orders\n        \)\n",
                  "    def dispatch(self, command, orders, now_ms):\n"
                  "        self.calls += 1\n"
                  "        return ()\n",
                  text,
                  flags=re.DOTALL,
              )
              text = re.sub(
                  r"\n        assert execution_store\.metrics\(\)\[[^\n]+\n",
                  "\n",
                  text,
              )
              text = re.sub(
                  r"\n        assert flushed\.blocked_on_unpublished_source == 0\n",
                  "\n",
                  text,
              )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Install project
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"

      - name: Format and lint
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests

      - name: Run Execution tests
        run: |
          pytest -q \
            tests/test_execution.py \
            tests/test_execution_store.py \
            tests/test_execution_engine_outbox.py \
            tests/test_execution_runtime.py

      - name: Run complete test suite
        run: pytest -q

      - name: Commit stabilized runtime
        run: |
          git rm -f --ignore-unmatch .github/workflows/finalize-execution-runtime-once.yml
          git rm -f --ignore-unmatch .github/workflows/stabilize-execution-runtime-once.yml
          git rm -f --ignore-unmatch scripts/finalize_execution_runtime.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finalize Execution runtime and serialized outbox"
          git pull --rebase origin execution-engine-v1
          git push origin HEAD:execution-engine-v1
