name: Definitive Execution Engine Validation Once

on:
  push:
    branches:
      - execution-engine-final

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: execution-engine-final
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"
          pip install pip-audit bandit

      - name: Apply canonical formatting
        run: ruff format src tests

      - name: Run Ruff lint
        run: ruff check src tests

      - name: Run complete test suite
        run: |
          set -o pipefail
          pytest -q | tee /tmp/execution-pytest.txt

      - name: Run dependency audit
        run: pip-audit

      - name: Run Bandit medium and high severity scan
        run: bandit -r src -x tests -ll

      - name: Build Docker image
        run: docker build -t crypto-quant:execution-engine-final .

      - name: Record validation and remove one-shot workflow
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          lines = Path("/tmp/execution-pytest.txt").read_text(encoding="utf-8").splitlines()
          summary = next(
              line for line in reversed(lines) if " passed" in line or " failed" in line
          )
          source = os.environ["GITHUB_SHA"]
          Path("docs/EXECUTION_ENGINE_VALIDATION.md").write_text(
              "# Execution Engine Final Validation\n\n"
              f"Validated source commit: `{source}`\n\n"
              "The following gates ran successfully on the same checkout after "
              "canonical formatting:\n\n"
              "- Ruff formatting applied to `src` and `tests`;\n"
              "- Ruff lint passed;\n"
              f"- complete Pytest suite passed: `{summary}`;\n"
              "- Python dependency audit reported no known vulnerabilities;\n"
              "- Bandit medium/high severity scan passed;\n"
              "- Docker image build passed;\n"
              "- static tests confirmed that Execution and shadow modules import no "
              "network/exchange-write library and define no real order-write primitive.\n\n"
              "This validation authorizes only shadow planning and deterministic local "
              "simulation. It does not authorize live trading, exchange credentials, "
              "real order submission, amendment or cancellation.\n",
              encoding="utf-8",
          )
          PY
          git rm .github/workflows/finalize-execution-engine-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs README.md CHANGELOG.md
          git commit -m "Record definitive Execution Engine validation"
          git push origin HEAD:execution-engine-final
