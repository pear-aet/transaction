name: Apply Portfolio Foundation Once

on:
  push:
    branches:
      - portfolio-account-engine-v1
    paths:
      - .github/workflows/apply-portfolio-foundation-once.yml
      - scripts/patch_portfolio_foundation.py
      - scripts/patch_portfolio_test_imports.py

permissions:
  contents: write

concurrency:
  group: portfolio-foundation-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-account-engine-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"
          pip install pip-audit bandit

      - name: Apply foundation patches
        run: |
          python scripts/patch_portfolio_foundation.py
          python scripts/patch_portfolio_test_imports.py

      - name: Format, lint and test
        run: |
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests
          pytest -q tests/test_portfolio_contracts.py tests/test_portfolio_accounting.py tests/test_portfolio_store.py
          pytest -q
          pip-audit
          bandit -r src -x tests -ll

      - name: Remove one-shot files and commit
        run: |
          git rm .github/workflows/apply-portfolio-foundation-once.yml
          git rm scripts/patch_portfolio_foundation.py
          git rm scripts/patch_portfolio_test_imports.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Harden Portfolio contracts and accounting foundation"
          git push origin HEAD:portfolio-account-engine-v1
