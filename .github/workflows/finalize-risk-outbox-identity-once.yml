name: Finalize Risk Outbox Identity Once

on:
  push:
    branches:
      - risk-engine-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out risk branch
        uses: actions/checkout@v4
        with:
          ref: risk-engine-v1
          fetch-depth: 0

      - name: Finalize Risk Engine outbox and identity
        run: python scripts/finalize_risk_outbox_and_identity.py

      - name: Format and lint
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff format src tests
          ruff check src tests

      - name: Remove one-shot patch files and commit
        run: |
          git rm .github/workflows/finalize-risk-outbox-identity-once.yml
          git rm scripts/finalize_risk_outbox_and_identity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Finalize Risk Engine outbox cleanup and identity validation"
          git push origin HEAD:risk-engine-v1
