name: Apply Portfolio Engine Once

on:
  push:
    branches:
      - portfolio-account-engine-v1
    paths:
      - .github/workflows/apply-portfolio-engine-once.yml

permissions:
  contents: write

concurrency:
  group: portfolio-lifecycle-convergence
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@v4
        with:
          ref: portfolio-account-engine-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --quiet --upgrade pip "setuptools>=83"
          pip install --quiet -e ".[dev]"
          pip install --quiet pip-audit bandit

      - name: Ensure lifecycle foundation is present
        run: |
          if grep -q '^def apply_funding_to_position' src/crypto_quant/portfolio_accounting.py; then
            echo "Portfolio lifecycle foundation is present"
          else
            test -f scripts/fix_portfolio_lifecycle_patch_indentation.py
            test -f scripts/patch_portfolio_lifecycle.py
            test -f scripts/patch_portfolio_lifecycle_failures.py
            test -f scripts/patch_portfolio_lifecycle_round4.py
            python scripts/fix_portfolio_lifecycle_patch_indentation.py
            python scripts/patch_portfolio_lifecycle.py
            python scripts/patch_portfolio_lifecycle_failures.py
            python scripts/patch_portfolio_lifecycle_round4.py
          fi

      - name: Apply execution event and engine boundary patches
        run: |
          python scripts/patch_portfolio_execution_events.py
          python scripts/patch_portfolio_engine_boundaries.py

      - name: Format and lint
        run: |
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests

      - name: Validate Portfolio Engine and complete project
        shell: bash
        run: |
          set +e
          {
            pytest -vv --tb=short tests/test_portfolio_engine.py
            pytest -q tests/test_portfolio_contracts.py \
              tests/test_portfolio_accounting.py \
              tests/test_portfolio_store.py \
              tests/test_portfolio_lifecycle.py \
              tests/test_portfolio_lifecycle_store.py \
              tests/test_execution_store_scans.py \
              tests/test_portfolio_engine.py
            pytest -q
            pip-audit
            bandit -r src -x tests -ll
          } > /tmp/portfolio-engine.log 2>&1
          status=$?
          set -e
          cat /tmp/portfolio-engine.log
          if [ "$status" -ne 0 ]; then
            mkdir -p .validation
            tail -n 260 /tmp/portfolio-engine.log > .validation/portfolio_engine_failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .validation/portfolio_engine_failure.txt
            if git diff --cached --quiet; then
              exit "$status"
            fi
            git commit -m "Record Portfolio Engine validation failure"
            git push origin HEAD:portfolio-account-engine-v1
            exit "$status"
          fi

      - name: Remove one-shot files and commit
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/apply-portfolio-lifecycle-once.yml \
            .github/workflows/apply-portfolio-lifecycle-v2-once.yml \
            .github/workflows/apply-portfolio-lifecycle-v3-once.yml \
            .github/workflows/apply-portfolio-engine-once.yml \
            scripts/patch_portfolio_lifecycle.py \
            scripts/fix_portfolio_lifecycle_patch_indentation.py \
            scripts/patch_portfolio_lifecycle_failures.py \
            scripts/patch_portfolio_lifecycle_round3.py \
            scripts/patch_portfolio_lifecycle_round4.py \
            scripts/patch_portfolio_execution_events.py \
            scripts/patch_portfolio_engine_boundaries.py
          rm -rf .validation
          git add -A src tests .github scripts .validation || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add atomic Portfolio Engine execution processing"
          git push origin HEAD:portfolio-account-engine-v1
