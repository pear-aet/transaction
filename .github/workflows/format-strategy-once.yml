name: Format Strategy Engine Once

on:
  push:
    branches:
      - strategy-engine-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out strategy branch
        uses: actions/checkout@v4
        with:
          ref: strategy-engine-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install formatter
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.12,<1"

      - name: Apply canonical formatting
        run: ruff format src tests

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/format-strategy-once.yml
          if git diff --cached --quiet && git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Apply canonical Ruff formatting"
          git push origin HEAD:strategy-engine-v1
