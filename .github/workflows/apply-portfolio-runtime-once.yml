name: Apply Portfolio Runtime Once

on:
  push:
    branches:
      - portfolio-account-engine-v1
    paths:
      - .github/workflows/apply-portfolio-runtime-once.yml
      - scripts/patch_portfolio_engine_boundaries.py
      - scripts/patch_portfolio_convergence.py

permissions:
  contents: write

concurrency:
  group: portfolio-runtime-convergence
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-account-engine-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --quiet --upgrade pip "setuptools>=83"
          pip install --quiet -e ".[dev]"
          pip install --quiet pip-audit bandit

      - name: Apply patches and validate complete Portfolio boundary
        shell: bash
        run: |
          set +e
          {
            python scripts/patch_portfolio_engine_boundaries.py
            python scripts/patch_portfolio_convergence.py
            ruff format src tests
            ruff check --fix src tests
            ruff format src tests
            ruff check src tests
            pytest -vv --tb=short \
              tests/test_portfolio_engine.py \
              tests/test_portfolio_runtime.py
            pytest -q
            pip-audit
            bandit -r src -x tests -ll
          } > /tmp/portfolio-runtime.log 2>&1
          status=$?
          set -e
          cat /tmp/portfolio-runtime.log
          if [ "$status" -ne 0 ]; then
            mkdir -p .validation
            tail -n 320 /tmp/portfolio-runtime.log > .validation/portfolio_runtime_failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .validation/portfolio_runtime_failure.txt
            if git diff --cached --quiet; then
              exit "$status"
            fi
            git commit -m "Record Portfolio convergence validation failure"
            git push origin HEAD:portfolio-account-engine-v1
            exit "$status"
          fi

      - name: Remove one-shot files and commit
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/apply-portfolio-engine-once.yml \
            .github/workflows/apply-portfolio-lifecycle-once.yml \
            .github/workflows/apply-portfolio-lifecycle-v2-once.yml \
            .github/workflows/apply-portfolio-lifecycle-v3-once.yml \
            .github/workflows/apply-portfolio-runtime-once.yml \
            scripts/fix_portfolio_lifecycle_patch_indentation.py \
            scripts/patch_portfolio_engine_boundaries.py \
            scripts/patch_portfolio_execution_events.py \
            scripts/patch_portfolio_lifecycle.py \
            scripts/patch_portfolio_lifecycle_failures.py \
            scripts/patch_portfolio_lifecycle_round3.py \
            scripts/patch_portfolio_lifecycle_round4.py \
            scripts/patch_portfolio_convergence.py
          rm -rf .validation
          git add -A src tests .github scripts .validation || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Converge Portfolio runtime and halted-account safety boundaries"
          git push origin HEAD:portfolio-account-engine-v1
