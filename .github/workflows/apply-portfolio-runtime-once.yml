name: Apply Portfolio Runtime Once

on:
  push:
    branches:
      - portfolio-account-engine-v1
    paths:
      - .github/workflows/apply-portfolio-runtime-once.yml

permissions:
  contents: write

concurrency:
  group: portfolio-runtime-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-account-engine-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality tools
        run: |
          python -m pip install --quiet --upgrade pip "setuptools>=83"
          pip install --quiet -e ".[dev]"
          pip install --quiet pip-audit bandit
      - name: Format and lint
        run: |
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests
      - name: Validate runtime and complete project
        shell: bash
        run: |
          set +e
          {
            pytest -vv --tb=short tests/test_portfolio_runtime.py
            pytest -q tests/test_portfolio_engine.py tests/test_portfolio_runtime.py
            pytest -q
            pip-audit
            bandit -r src -x tests -ll
          } > /tmp/portfolio-runtime.log 2>&1
          status=$?
          set -e
          cat /tmp/portfolio-runtime.log
          if [ "$status" -ne 0 ]; then
            mkdir -p .validation
            tail -n 260 /tmp/portfolio-runtime.log > .validation/portfolio_runtime_failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .validation/portfolio_runtime_failure.txt
            if git diff --cached --quiet; then
              exit "$status"
            fi
            git commit -m "Record Portfolio runtime validation failure"
            git push origin HEAD:portfolio-account-engine-v1
            exit "$status"
          fi
      - name: Remove one-shot files and commit
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/apply-portfolio-engine-once.yml \
            .github/workflows/apply-portfolio-runtime-once.yml
          rm -rf .validation
          git add -A src tests .github .validation || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add durable Portfolio runtime and Risk snapshot provider"
          git push origin HEAD:portfolio-account-engine-v1
