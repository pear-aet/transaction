name: Final Risk Validation Once

on:
  push:
    branches:
      - risk-engine-v1

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out risk branch
        uses: actions/checkout@v4
        with:
          ref: risk-engine-v1
          fetch-depth: 0

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"

      - name: Apply canonical formatting
        run: ruff format src tests

      - name: Run Ruff checks
        run: ruff check src tests

      - name: Run complete test suite
        run: |
          set -o pipefail
          pytest -q | tee /tmp/risk-pytest.txt

      - name: Run dependency and security audits
        run: |
          pip install pip-audit bandit
          pip-audit
          bandit -r src -x tests -ll

      - name: Build Docker image
        run: docker build -t crypto-quant:risk-engine-final .

      - name: Record validation and remove one-shot workflow
        run: |
          summary="$(tail -n 1 /tmp/risk-pytest.txt)"
          cat > docs/RISK_ENGINE_VALIDATION.md <<EOF
          # Risk Engine Validation

          Validated source commit: \`${GITHUB_SHA}\`

          Final gates executed on the same checkout:

          - Ruff formatting applied to \`src\` and \`tests\`;
          - Ruff lint passed;
          - complete Pytest suite passed: \`${summary}\`;
          - \`pip-audit\` passed;
          - Bandit medium/high severity scan passed;
          - Docker image build passed.

          This record does not authorize live trading. Execution Engine and exchange-order submission remain outside the validated scope.
          EOF
          git rm .github/workflows/final-risk-validation-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git commit -m "Record final Risk Engine validation"
          git push origin HEAD:risk-engine-v1
