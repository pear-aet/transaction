name: Integrate Execution Reconciliation Once

on:
  push:
    branches:
      - execution-engine-final

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: execution-engine-final
          fetch-depth: 0

      - name: Integrate reconciliation
        run: python scripts/integrate_execution_reconciliation.py

      - name: Install project
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"

      - name: Format, lint and test shadow and reconciliation
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests
          pytest -q \
            tests/test_shadow_execution_compatibility.py \
            tests/test_execution_reconcile.py \
            tests/test_execution_reconciliation_engine.py \
            tests/test_execution_engine.py \
            tests/test_execution_runtime.py

      - name: Remove one-shot files and commit
        run: |
          git rm .github/workflows/integrate-execution-reconciliation-once.yml
          git rm scripts/integrate_execution_reconciliation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Add fail-closed Execution reconciliation"
          git push origin HEAD:execution-engine-final
