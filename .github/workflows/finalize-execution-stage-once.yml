name: Finalize Execution Engine Stage Once

on:
  push:
    branches:
      - execution-engine-v1

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: definitive-execution-stage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: execution-engine-v1
          fetch-depth: 0

      - name: Cancel superseded branch workflows
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=execution-engine-v1&status=in_progress&per_page=100" \
            --jq '.workflow_runs[].id' | while read -r run_id; do
              if [ -n "${run_id}" ] && [ "${run_id}" != "${GITHUB_RUN_ID}" ]; then
                gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              fi
            done
          git pull --ff-only origin execution-engine-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply definitive stage finalizer
        run: python scripts/finalize_execution_stage.py

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"
          pip install pip-audit bandit

      - name: Apply canonical formatting and lint
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests

      - name: Run Execution Engine suite
        run: |
          set -o pipefail
          pytest -q tests/test_execution*.py | tee /tmp/execution-tests.txt

      - name: Run complete project suite
        run: |
          set -o pipefail
          pytest -q | tee /tmp/project-tests.txt

      - name: Run dependency and security audits
        run: |
          pip-audit
          bandit -r src -x tests -ll

      - name: Build Docker image
        run: docker build -t crypto-quant:execution-engine-final .

      - name: Record validation
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          execution_summary = Path("/tmp/execution-tests.txt").read_text(
              encoding="utf-8"
          ).splitlines()[-1]
          project_summary = Path("/tmp/project-tests.txt").read_text(
              encoding="utf-8"
          ).splitlines()[-1]
          Path("docs/EXECUTION_ENGINE_VALIDATION.md").write_text(
              "# Execution Engine Validation\n\n"
              f"Validated source commit: `{os.environ['GITHUB_SHA']}`\n\n"
              "All gates below ran successfully on the same checkout after canonical formatting:\n\n"
              f"- Execution Engine suite: `{execution_summary}`;\n"
              f"- complete project suite: `{project_summary}`;\n"
              "- Ruff formatting and lint passed;\n"
              "- `pip-audit` reported no known dependency vulnerabilities;\n"
              "- Bandit medium/high severity scan passed;\n"
              "- Docker image build passed.\n\n"
              "The validated stage supports shadow and deterministic local simulation only. "
              "It does not authorize live exchange order submission, amendment or cancellation.\n",
              encoding="utf-8",
          )
          PY

      - name: Remove temporary automation and push final branch
        run: |
          git rm -f --ignore-unmatch .github/workflows/finalize-execution-runtime-once.yml
          git rm -f --ignore-unmatch .github/workflows/stabilize-execution-runtime-once.yml
          git rm -f --ignore-unmatch .github/workflows/harden-execution-recovery-once.yml
          git rm -f --ignore-unmatch .github/workflows/migrate-shadow-execution-once.yml
          git rm -f --ignore-unmatch .github/workflows/finalize-execution-stage-once.yml
          git rm -f --ignore-unmatch scripts/finalize_execution_runtime.py
          git rm -f --ignore-unmatch scripts/harden_execution_recovery.py
          git rm -f --ignore-unmatch scripts/migrate_shadow_execution.py
          git rm -f --ignore-unmatch scripts/finalize_execution_stage.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git commit -m "Finalize production-grade shadow Execution Engine"
          git pull --rebase origin execution-engine-v1
          git push origin HEAD:execution-engine-v1

      - name: Mark pull request ready and enable auto-merge
        run: |
          gh pr ready 13 --repo "${GITHUB_REPOSITORY}"
          gh pr merge 13 --repo "${GITHUB_REPOSITORY}" --auto --squash --delete-branch || true
