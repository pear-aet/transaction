name: Apply Portfolio Audit Once

on:
  push:
    branches:
      - portfolio-account-engine-v1
    paths:
      - .github/workflows/apply-portfolio-audit-once.yml
      - scripts/patch_portfolio_audit_integration.py
      - src/crypto_quant/portfolio_audit.py
      - tests/test_portfolio_audit.py
      - tests/test_portfolio_audit_integration.py

permissions:
  contents: write

concurrency:
  group: portfolio-audit-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-account-engine-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --quiet --upgrade pip "setuptools>=83"
          pip install --quiet -e ".[dev]"
          pip install --quiet pip-audit bandit

      - name: Apply audit integration and validate
        shell: bash
        run: |
          set +e
          {
            python scripts/patch_portfolio_audit_integration.py
            ruff format src tests
            ruff check --fix src tests
            ruff format src tests
            ruff check src tests
            pytest -vv --tb=short \
              tests/test_portfolio_audit.py \
              tests/test_portfolio_audit_integration.py
            pytest -q tests/test_portfolio_engine.py tests/test_portfolio_runtime.py
            pytest -q
            pip-audit
            bandit -r src -x tests -ll
          } > /tmp/portfolio-audit.log 2>&1
          status=$?
          set -e
          cat /tmp/portfolio-audit.log
          if [ "$status" -ne 0 ]; then
            mkdir -p .validation
            tail -n 360 /tmp/portfolio-audit.log > .validation/portfolio_audit_failure.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .validation/portfolio_audit_failure.txt
            if git diff --cached --quiet; then
              exit "$status"
            fi
            git commit -m "Record Portfolio materialized audit failure"
            git push origin HEAD:portfolio-account-engine-v1
            exit "$status"
          fi

      - name: Remove one-shot files and commit
        run: |
          git rm .github/workflows/apply-portfolio-audit-once.yml
          git rm scripts/patch_portfolio_audit_integration.py
          rm -rf .validation
          git add -A src tests .github scripts .validation || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add Portfolio journal rebuild and materialized-state audit"
          git push origin HEAD:portfolio-account-engine-v1
