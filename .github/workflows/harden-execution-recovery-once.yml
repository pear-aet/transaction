name: Harden Execution Recovery Once

on:
  push:
    branches:
      - execution-engine-v1

permissions:
  contents: write

concurrency:
  group: harden-execution-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out execution branch
        uses: actions/checkout@v4
        with:
          ref: execution-engine-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply recovery hardening
        run: python scripts/harden_execution_recovery.py

      - name: Install project
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          pip install -e ".[dev]"

      - name: Format and lint
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests

      - name: Run Execution tests
        run: |
          pytest -q \
            tests/test_execution.py \
            tests/test_execution_store.py \
            tests/test_execution_engine_outbox.py \
            tests/test_execution_runtime.py \
            tests/test_execution_local_broker.py

      - name: Run complete test suite
        run: pytest -q

      - name: Run security checks
        run: |
          pip install pip-audit bandit
          pip-audit
          bandit -r src -x tests -ll

      - name: Build Docker image
        run: docker build -t crypto-quant:execution-recovery .

      - name: Remove one-shot files and commit
        run: |
          git rm -f --ignore-unmatch .github/workflows/finalize-execution-runtime-once.yml
          git rm -f --ignore-unmatch .github/workflows/stabilize-execution-runtime-once.yml
          git rm -f --ignore-unmatch .github/workflows/harden-execution-recovery-once.yml
          git rm -f --ignore-unmatch scripts/finalize_execution_runtime.py
          git rm -f --ignore-unmatch scripts/harden_execution_recovery.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git commit -m "Harden Execution recovery and local simulation"
          git pull --rebase origin execution-engine-v1
          git push origin HEAD:execution-engine-v1
