name: Patch EventEngine Invalid Intent Once

on:
  push:
    branches:
      - risk-engine-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out risk branch
        uses: actions/checkout@v4
        with:
          ref: risk-engine-v1
          fetch-depth: 0

      - name: Fail closed on invalid legacy strategy intent
        run: python scripts/patch_event_engine_invalid_intent.py

      - name: Format and lint
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff format src tests
          ruff check src tests

      - name: Remove one-shot patch files and commit
        run: |
          git rm .github/workflows/patch-event-engine-invalid-intent-once.yml
          git rm scripts/patch_event_engine_invalid_intent.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Fail closed on invalid EventEngine strategy intents"
          git push origin HEAD:risk-engine-v1
