name: Materialize Portfolio Convergence Once

on:
  workflow_dispatch:
  push:
    branches:
      - portfolio-account-engine-v1
    paths:
      - .github/workflows/apply-portfolio-master-convergence-once.yml
      - scripts/*portfolio*.py
      - scripts/*research*.py
      - scripts/*backtest*.py
      - src/crypto_quant/portfolio*.py
      - src/crypto_quant/research*.py
      - src/crypto_quant/backtest.py
      - src/crypto_quant/paper.py
      - src/crypto_quant/cli.py
      - tests/portfolio_fixtures.py
      - tests/test_portfolio*.py
      - tests/test_research*.py
      - tests/test_backtest_accounting_mode.py

permissions:
  contents: read

concurrency:
  group: portfolio-master-convergence-once
  cancel-in-progress: false

env:
  PORTFOLIO_BRANCH: portfolio-account-engine-v1
  MATERIALIZED_ARTIFACT: portfolio-materialized-${{ github.sha }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deterministic materialization tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install -e ".[dev]"

      - name: Materialize the ordered patch chain twice
        run: python scripts/materialize_portfolio_convergence.py

      - name: Produce the single source image used by every gate
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
          ruff check src tests
          python -m compileall -q src
          git diff --check
          mkdir -p "$RUNNER_TEMP/portfolio-materialized"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/portfolio-materialized/source-sha.txt"
          tar \
            --exclude=.git \
            --exclude=.pytest_cache \
            --exclude=.ruff_cache \
            --exclude=.coverage \
            --exclude='*/__pycache__' \
            --exclude='*.pyc' \
            --exclude='*.egg-info' \
            -czf "$RUNNER_TEMP/portfolio-materialized/materialized-source.tgz" .
          sha256sum "$RUNNER_TEMP/portfolio-materialized/materialized-source.tgz" \
            > "$RUNNER_TEMP/portfolio-materialized/materialized-source.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MATERIALIZED_ARTIFACT }}
          path: ${{ runner.temp }}/portfolio-materialized/
          if-no-files-found: error
          retention-days: 1

  validate:
    needs: prepare
    name: validate-python-${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MATERIALIZED_ARTIFACT }}
          path: ${{ runner.temp }}/portfolio-materialized

      - name: Expand and authenticate prepared source
        run: |
          test "$(cat "$RUNNER_TEMP/portfolio-materialized/source-sha.txt")" = "$GITHUB_SHA"
          cd "$RUNNER_TEMP/portfolio-materialized"
          sha256sum -c materialized-source.sha256
          tar -xzf materialized-source.tgz -C "$GITHUB_WORKSPACE"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install prepared source
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install -e ".[dev]"

      - name: Verify formatting, imports and bytecode compilation
        run: |
          ruff format --check src tests
          ruff check src tests
          python -m compileall -q src
          python - <<'PY'
          from crypto_quant.backtest import run_backtest, run_portfolio_backtest
          from crypto_quant.paper import LEGACY_PAPER_DISABLED
          from crypto_quant.portfolio_accounting import apply_funding_to_position, apply_mark_fact
          from crypto_quant.portfolio_audit import PortfolioAuditor
          from crypto_quant.portfolio_engine import PortfolioEngine
          from crypto_quant.portfolio_runtime import PortfolioRuntime
          from crypto_quant.portfolio_store import PortfolioStore
          from crypto_quant.research_accounting import ResearchAccount
          from crypto_quant.research_engine import ResearchEventEngine
          from crypto_quant.research_execution import ResearchExecutionFactory
          from crypto_quant.research_trading import ResearchTradeCoordinator

          assert run_backtest and run_portfolio_backtest
          assert LEGACY_PAPER_DISABLED
          assert apply_funding_to_position and apply_mark_fact
          assert PortfolioAuditor and PortfolioEngine and PortfolioRuntime and PortfolioStore
          assert ResearchAccount and ResearchEventEngine
          assert ResearchExecutionFactory and ResearchTradeCoordinator
          PY

      - name: Run focused Portfolio and Research tests
        run: |
          pytest -q \
            tests/test_portfolio_contracts.py \
            tests/test_portfolio_accounting.py \
            tests/test_portfolio_store.py \
            tests/test_portfolio_lifecycle.py \
            tests/test_portfolio_lifecycle_store.py \
            tests/test_execution_store_scans.py \
            tests/test_portfolio_engine.py \
            tests/test_portfolio_runtime.py \
            tests/test_portfolio_audit.py \
            tests/test_portfolio_audit_integration.py \
            tests/test_portfolio_runtime_audit.py \
            tests/test_portfolio_network_boundary.py \
            tests/test_legacy_paper_boundary.py \
            tests/test_research_accounting_parity.py \
            tests/test_research_accounting_short_parity.py \
            tests/test_research_accounting_partial_fills.py \
            tests/test_research_accounting_exit_commands.py \
            tests/test_research_execution.py \
            tests/test_research_trading.py \
            tests/test_research_engine_parity.py \
            tests/test_backtest_accounting_mode.py

      - name: Run complete project test suite
        run: pytest -q

  security:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MATERIALIZED_ARTIFACT }}
          path: ${{ runner.temp }}/portfolio-materialized

      - name: Expand and authenticate prepared source
        run: |
          test "$(cat "$RUNNER_TEMP/portfolio-materialized/source-sha.txt")" = "$GITHUB_SHA"
          cd "$RUNNER_TEMP/portfolio-materialized"
          sha256sum -c materialized-source.sha256
          tar -xzf materialized-source.tgz -C "$GITHUB_WORKSPACE"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install prepared source and security tools
        run: |
          python -m pip install --upgrade pip "setuptools>=83"
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit bandit

      - name: Audit dependencies
        run: pip-audit

      - name: Scan Python source
        run: bandit -r src -x tests -ll

      - name: Prove Portfolio has no exchange-write path
        run: pytest -q tests/test_portfolio_network_boundary.py

  docker:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MATERIALIZED_ARTIFACT }}
          path: ${{ runner.temp }}/portfolio-materialized

      - name: Expand and authenticate prepared source
        run: |
          test "$(cat "$RUNNER_TEMP/portfolio-materialized/source-sha.txt")" = "$GITHUB_SHA"
          cd "$RUNNER_TEMP/portfolio-materialized"
          sha256sum -c materialized-source.sha256
          tar -xzf materialized-source.tgz -C "$GITHUB_WORKSPACE"

      - name: Build the exact prepared source image
        run: docker build -t transaction:portfolio-convergence .

  materialize:
    needs: [prepare, validate, security, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-account-engine-v1
          fetch-depth: 0

      - name: Refuse to overwrite a newer branch head
        run: |
          git fetch origin "$PORTFOLIO_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/$PORTFOLIO_BRANCH)" = "$GITHUB_SHA"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MATERIALIZED_ARTIFACT }}
          path: ${{ runner.temp }}/portfolio-materialized

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the exact source image that passed every gate
        run: |
          test "$(cat "$RUNNER_TEMP/portfolio-materialized/source-sha.txt")" = "$GITHUB_SHA"
          cd "$RUNNER_TEMP/portfolio-materialized"
          sha256sum -c materialized-source.sha256
          tar -xzf materialized-source.tgz -C "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          python scripts/materialize_portfolio_convergence.py --verify-only
          git diff --check

      - name: Remove all one-shot machinery
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/apply-portfolio-audit-once.yml \
            .github/workflows/apply-portfolio-master-convergence-once.yml \
            scripts/materialize_portfolio_convergence.py \
            scripts/normalize_portfolio_patch_idempotency.py \
            scripts/fix_portfolio_lifecycle_patch_indentation.py \
            scripts/patch_portfolio_lifecycle.py \
            scripts/patch_portfolio_lifecycle_failures.py \
            scripts/patch_portfolio_lifecycle_round3.py \
            scripts/patch_portfolio_lifecycle_round4.py \
            scripts/patch_portfolio_execution_events.py \
            scripts/patch_portfolio_engine_boundaries.py \
            scripts/patch_portfolio_convergence.py \
            scripts/patch_portfolio_audit_integration.py \
            scripts/patch_portfolio_audit_hardening.py \
            scripts/patch_portfolio_snapshot_halt_reason.py \
            scripts/patch_portfolio_runtime_audit_propagation.py \
            scripts/patch_legacy_paper_boundary.py \
            scripts/patch_research_execution_hardening.py \
            scripts/patch_research_trading_hardening.py \
            scripts/patch_research_engine_projection.py \
            scripts/patch_backtest_accounting_mode.py \
            scripts/patch_backtest_authoritative_default.py
          rm -rf .validation

      - name: Commit only the tested permanent source
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent Portfolio convergence changes were produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Materialize authoritative Portfolio accounting and research parity"
          git push origin HEAD:"$PORTFOLIO_BRANCH"
