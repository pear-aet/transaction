    config = StrategyConfig(
        symbol="BTC/USDT:USDT",
        high_timeframe="1h",
        low_timeframe="15m",
        entry_model="chan_fractal",
    )
    decision_time = low[-1].timestamp + LOW_MS

    with pytest.raises(ValueError, match="contains a gap"):
        StrategyContext(gapped_low, tuple(high), config, decision_time, None)
'''
          if "test_strategy_context_rejects_internal_candle_gaps" not in purity_text:
              purity_text += gap_test
          purity.write_text(purity_text, encoding="utf-8")

          replay = Path("tests/test_strategy_replay.py")
          replay_text = replay.read_text(encoding="utf-8")
          if "from dataclasses import replace\n" not in replay_text:
              replay_text = "from dataclasses import replace\n\n" + replay_text
          replay_test = '''


def test_replay_batch_cannot_commit_beyond_its_snapshot(tmp_path) -> None:
    store = StrategyStore(tmp_path / "quant.db")
    seed(store)
    ledger = StrategyReplayLedger(store)
    batch = ledger.read_batch("risk-v1")

    with pytest.raises(ValueError, match="within its snapshot"):
        ledger.commit_batch(
