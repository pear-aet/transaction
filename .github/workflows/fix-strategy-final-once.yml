          if "test_replay_batch_cannot_commit_beyond_its_snapshot" not in replay_text:
              replay_text += replay_test
          replay.write_text(replay_text, encoding="utf-8")
          PY

      - name: Format and verify
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff format src tests
          ruff check src tests

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/fix-strategy-final-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Harden Strategy Engine gaps and replay boundaries"
          git push origin HEAD:strategy-engine-v1
