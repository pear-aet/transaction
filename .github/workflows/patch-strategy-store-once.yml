name: Patch Strategy Store Once

on:
  push:
    branches:
      - strategy-engine-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out strategy branch
        uses: actions/checkout@v4
        with:
          ref: strategy-engine-v1
          fetch-depth: 0

      - name: Replace dynamic query construction
        run: python scripts/patch_strategy_store_static_sql.py

      - name: Format and lint
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff format src tests
          ruff check src tests

      - name: Remove one-shot patch files and commit
        run: |
          git rm .github/workflows/patch-strategy-store-once.yml
          git rm scripts/patch_strategy_store_static_sql.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Replace dynamic Strategy Store SQL construction"
          git push origin HEAD:strategy-engine-v1
